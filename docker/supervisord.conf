[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:x11]
priority=10
command=/usr/bin/Xtigervnc -desktop "Carvera Controller" -geometry 1920x1200 -rfbport 5900 -SecurityTypes None -AlwaysShared -AcceptKeyEvents -AcceptPointerEvents -AcceptSetDesktopSize -SendCutText -AcceptCutText :0
environment=HOME="/config",DISPLAY=":0"
autorestart=true
redirect_stderr=true

[program:websockify]
priority=20
command=/usr/bin/websockify --web=/usr/share/novnc 8080 localhost:5900
autorestart=true
redirect_stderr=true

[program:openbox]
priority=30
command=/usr/bin/openbox
environment=HOME="/config",DISPLAY=":0"
autorestart=true
redirect_stderr=true

[program:carveracontroller]
priority=40
directory=/config
command=/opt/carvera/bin/python -m carveracontroller
environment=HOME="/config",DISPLAY=":0",PYTHONPATH="/opt/carvera-src",CARVERA_JOBS_DIR="/jobs",CARVERA_JOB_STATE="/config/job-state.json",KIVY_GL_BACKEND="sdl2"
autorestart=true
redirect_stderr=true
